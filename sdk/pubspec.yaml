name: codex_fabric
description: A self-hosted, zero-trust video and data streaming SDK for high-security enterprise environments.
version: 0.1.0
homepage: https://github.com/Ejoyment/codex-fabric
repository: https://github.com/Ejoyment/codex-fabric
issue_tracker: https://github.com/Ejoyment/codex-fabric/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # WebRTC
  flutter_webrtc: ^0.9.45
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # Cryptography
  cryptography: ^2.7.0
  encrypt: ^5.0.3
  pointycastle: ^3.7.4
  ed25519_edwards: ^0.3.1
  
  # Security
  flutter_secure_storage: ^9.0.0
  # secure_storage: ^0.1.3
  
  # Utils
  uuid: ^4.2.1
  json_annotation: ^4.8.1
  meta: ^1.10.0
  collection: ^1.18.0
  
  # Logging
  logger: ^2.0.2+1
  
  # State management (optional, for example app)
  # provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mocktail: ^1.0.1
  test: ^1.24.9

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using platform-specific functionality.
  plugin:
    platforms:
      android:
        package: com.codex.fabric
        pluginClass: CodexFabricPlugin
      ios:
        pluginClass: CodexFabricPlugin
      web:
        pluginClass: CodexFabricWeb
        fileName: src/web/codex_fabric_web.dart
      windows:
        pluginClass: CodexFabricPlugin
      macos:
        pluginClass: CodexFabricPlugin
      linux:
        pluginClass: CodexFabricPlugin

  # An image asset can refer to one or more additional images using
  # a relative path and asset type suffix.
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

